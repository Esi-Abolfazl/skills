name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
      - run: bash tests/template-parity.sh
      - run: bash tests/mod-version.sh selftest
      - run: bash tests/mod-version.sh "${{ github.event.pull_request.base.sha || github.event.before }}"
      - run: bash skills/wrap/tests/dry-run.sh
      - run: bash skills/wrap/tests/gate.sh
      - run: uv run skills/pr-summary/abridge.py selftest
      - run: uv run skills/task-summary/sanitize.py selftest
      - run: uv run skills/iran-stores/iran_stores.py selftest
      - run: uv run skills/youtube-video-review/quotes.py selftest
      - run: uv run skills/qa-engineer/scripts/qa_login.py selftest
      - run: uv run tests/skill-lint.py selftest
      - run: uv run tests/skill-lint.py
  usage-band-scan:
    # the scan runs on the user's macOS awk, dd and od
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --experimental-strip-types mods/usage-band/bench/turns.mjs
